# Configuração do Camaleão. Todas as chaves são opcionais: os valores abaixo são os padrões.
# Para ajustar, copie este arquivo para config.yaml (fora do git) e mantenha só o que quiser mudar.

navegador:
  executavel: auto # auto (Chrome instalado, senão Chromium do Playwright), chrome ou chromium
  portaCdp: 9333 # porta de depuração do navegador dedicado do Camaleão

llm:
  modeloTexto: claude-haiku-5-5 # extração, análise e respostas (use o id completo: o alias `haiku` ainda aponta para a 4.5)
  modeloTailoring: claude-sonnet-5-5 # reescrita do currículo e da carta
  modeloAgente: claude-haiku-5-5 # modelo do fallback agêntico
  modeloAgenteReserva: claude-sonnet-5-5 # refaz a vaga com este modelo se o agente degenerar (saída sem fim)
  maxTokensThinking: 0 # teto de tokens de raciocínio por chamada (0 desliga; mais caro e lento)
  timeoutTextoSeg: 180 # tempo máximo de cada chamada de texto

agente:
  maxTurnos: 40 # teto de turnos do agente por vaga em cada `aplicar`
  timeoutMin: 10 # teto de minutos de execução do agente por vaga (pausas não contam)
  porta: 4321 # porta do agente local do site (`camaleao agente`), só em 127.0.0.1
  # Origens do site que podem falar com o agente. A última é a que `camaleao agente` abre: acrescente a
  # URL do seu site publicado (ex.: https://seu-projeto.vercel.app) depois da de desenvolvimento.
  origensPermitidas: [http://localhost:5173]

preparar:
  paralelo: 2 # vagas processadas ao mesmo tempo no `preparar`
  maxTentativas: 3 # tentativas antes de desistir de uma vaga com ERRO_PREPARO

aderencia:
  scoreMinimo: 60 # abaixo disso a vaga vira DESCARTADA (use --forcar para ignorar)

carta:
  maxPalavras: 200

gupy:
  anexoPorCandidatura: true # false: na Gupy, anexa o PDF genérico do master (ver docs/spikes/gupy.md)

notificacao:
  toast: true # toast do Windows ao terminar ou parar o `preparar`
