# Perfil FICTÍCIO de exemplo. O seu fica em curriculo/perfil.yaml (fora do git).
# Documentos, salário, diversidade e endereço completo são SENSÍVEIS: nunca vão ao LLM, ao log nem ao git.
# São preenchidos nos formulários apenas por código.

documentos:
  cpf: "000.000.000-00"
  dataNascimento: "1995-06-15" # AAAA-MM-DD
  # rg: "00.000.000-0"

endereco:
  logradouro: Rua Exemplo
  numero: "100"
  bairro: Centro
  cidade: São Paulo
  uf: SP
  cep: "00000-000"
  pais: Brasil

# Pretensão salarial por regime e moeda. O Camaleão escolhe pela vaga (CLT anual = 13 salários).
# Opcional: sem este bloco, os campos de pretensão ficam vazios e aparecem destacados na revisão.
salario:
  clt_brl_mensal: 15000
  pj_brl_mensal: 20000
  usd_anual: 60000
  # Opcional: salário atual ou último, para campos "compartilhe seu salário atual". Sem ele, o campo fica
  # vazio (o Camaleão nunca usa a pretensão no lugar).
  # atual: "12000 CLT + VR/VA + plano de saúde"

disponibilidade:
  avisoPrevioDias: 30
  inicioImediato: false
  viagens: true
  mudanca: false

autorizacaoTrabalho:
  brasil: true
  precisaSponsorship: true # para vagas fora do Brasil
  paisesAutorizados: [BR]

# Opcional. Sem dado, o Camaleão marca "prefiro não informar".
# genero: mulher_cis, mulher_trans, homem_cis, homem_trans, nao_binario ou outro
# raca: branca, preta, parda, amarela ou indigena
diversidade:
  genero: mulher_cis
  # raca: parda
  # pcd: false
  # lgbtqia: false

# Opt-ins e consentimentos dos formulários, preenchidos por código (sem LLM). Chave ausente = aceitar.
# O tratamento de dados obrigatório (LGPD, privacidade) é sempre aceito: sem ele não há candidatura.
# Chaves aceitas (true ou false):
#   tratamentoDados: privacidade, LGPD, termos de uso (quando opcional)
#   reterDados: manter os dados para vagas futuras (banco de talentos)
#   compartilharParceiros: compartilhar o currículo com parceiros ou terceiros
#   transcricaoIa: gravar ou transcrever entrevistas, inclusive com IA
#   comunicacoes: receber e-mail, SMS, WhatsApp e novidades
#   diversidade: false responde "prefiro não informar" nos campos de diversidade
consentimentos:
  compartilharParceiros: false
  comunicacoes: false

# Usadas no score de aderência.
preferencias:
  modelos: [remoto, hibrido] # remoto, hibrido, presencial
  cidades: [São Paulo]
  senioridades: [pleno, senior] # estagio, junior, pleno, senior, especialista, lideranca
  regimes: [clt, pj, contractor]

comoSoube: LinkedIn
