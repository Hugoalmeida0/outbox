# Verificação completa (arquitetura.md §11): tipos, lint, formatação, site (tipos, lint, build e testes),
# testes com cobertura (inclui o e2e do site com o agente) e audit. O `npm ci` instala os workspaces.
name: verificar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run verificar
