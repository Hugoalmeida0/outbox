# Grafo de conhecimento do código (Graphify, modo code-only: tree-sitter local, sem LLM, sem segredos).
# PR: só valida a geração. Push em main: regenera e comita graphify-out/ se o grafo mudou.
name: graphify

# Quando roda: a cada push em main (atualiza o grafo) e a cada PR para main (só confere).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Por padrão o workflow só pode ler o repositório; o job que publica pede escrita sozinho.
permissions:
  contents: read

# Se dois pushes chegarem juntos, o segundo espera o primeiro terminar em vez de cancelá-lo,
# assim nenhuma atualização do grafo se perde.
concurrency:
  group: graphify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

# Modo só-código: o Graphify lê o código localmente e não chama nenhuma IA, por isso não há segredos.
env:
  GRAPHIFY_BACKEND: none
  PYTHONUTF8: "1"

jobs:
  # Job do PR: gera o grafo só para provar que o código do PR não o quebra. Não comita nada
  # e não recebe permissão de escrita (nem guarda o token no checkout).
  validar:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Instala o Python e guarda os pacotes em cache; a chave do cache é a versão fixada do Graphify.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-graphify.txt
      - run: pip install -r requirements-graphify.txt
      # Lê o código do repositório e monta o grafo em graphify-out/.
      - run: graphify update .
      # Falha o PR se o grafo saiu vazio ou sem relações entre os nós.
      - name: Valida o grafo gerado
        run: |
          test -s graphify-out/graph.json
          test -s graphify-out/GRAPH_REPORT.md
          python -c "import json; d = json.load(open('graphify-out/graph.json', encoding='utf-8')); n, e = len(d['nodes']), len(d['links']); print(n, 'nós,', e, 'arestas'); assert n > 0 and e > 0"

  # Job do push em main: regenera o grafo e, se ele mudou, o bot comita o resultado na própria main.
  atualizar:
    # Anti-loop: não roda se o autor for o próprio bot ou se o commit pedir "[skip ci]".
    # (O commit do bot também é protegido pelo token padrão, que não dispara novos workflows.)
    if: >-
      github.event_name == 'push' &&
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Só este job pode escrever no repositório, e só ele deixa o token disponível para o git push.
    permissions:
      contents: write
    steps:
      # Baixa só o commit mais recente (basta para regenerar e publicar).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-graphify.txt
      - run: pip install -r requirements-graphify.txt
      # Reconstrói o grafo a partir do código atual de main.
      - run: graphify update .
      # Compara o grafo novo com o que já está versionado. O campo built_at_commit muda a cada
      # commit sem que o grafo mude de fato; ignorá-lo evita um commit do bot a cada push.
      - name: Decide se o grafo mudou
        id: diff
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess
          novo = json.load(open('graphify-out/graph.json', encoding='utf-8'))
          antigo = subprocess.run(['git', 'show', 'HEAD:graphify-out/graph.json'], capture_output=True, text=True)
          novo.pop('built_at_commit', None)
          if antigo.returncode == 0:
              base = json.loads(antigo.stdout)
              base.pop('built_at_commit', None)
          else:
              base = None
          print('mudou=' + str(base != novo).lower())
          PY
      # Só chega aqui se o grafo realmente mudou: o bot comita os dois arquivos e publica em main.
      # O "pull --rebase" cobre o caso de alguém ter dado push enquanto o job rodava.
      # O "[skip ci]" na mensagem impede que esse commit dispare outros workflows.
      - name: Comita e publica em main
        if: steps.diff.outputs.mudou == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f graphify-out/graph.json graphify-out/GRAPH_REPORT.md
          git commit -m 'chore(graphify): update knowledge graph [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
