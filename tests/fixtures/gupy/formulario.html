<!-- Fixture SINTÉTICA: modela o fluxo em etapas da Gupy (estrutura real não verificada; ver docs/spikes/gupy.md). -->
<html lang="pt-BR"><body>
<main id="vaga"><h1>Desenvolvedor(a) Back-end Sênior</h1><button id="candidatar">Candidatar-se</button></main>
<form id="form" style="display:none" onsubmit="return false">
  <section id="etapa1">
    <h2>Dados pessoais</h2>
    <label for="nome">Nome completo *</label><input id="nome" name="nome" required>
    <label for="cpf">CPF *</label><input id="cpf" name="cpf" required>
    <label for="nascimento">Data de nascimento *</label><input id="nascimento" name="nascimento" required>
    <button type="button" class="proximo">Continuar</button>
  </section>
  <section id="etapa2" style="display:none">
    <h2>Currículo e perguntas</h2>
    <label for="cv">Currículo (PDF) *</label><input id="cv" name="cv" type="file" required>
    <label for="pretensao">Pretensão salarial *</label>
    <select id="pretensao" name="pretensao" required><option value="">Selecione</option><option>Até R$ 10.000</option><option>R$ 10.001 a R$ 15.000</option><option>Acima de R$ 15.000</option></select>
    <fieldset><legend>Você tem disponibilidade para trabalho híbrido? *</legend>
      <label><input type="radio" name="hibrido" value="sim" required> Sim</label>
      <label><input type="radio" name="hibrido" value="nao"> Não</label>
    </fieldset>
    <button type="button" class="proximo">Continuar</button>
  </section>
  <section id="etapa3" style="display:none">
    <label for="motivo">Por que você quer trabalhar aqui? *</label><textarea id="motivo" name="motivo" required></textarea>
    <label><input type="checkbox" name="lgpd" required> Li e concordo com a política de privacidade *</label>
    <button type="submit" id="finalizar">Finalizar candidatura</button>
  </section>
</form>
<script>
  document.getElementById("candidatar").onclick = () => { document.getElementById("vaga").style.display = "none"; document.getElementById("form").style.display = "block"; };
  let etapa = 1;
  for (const b of document.querySelectorAll(".proximo")) b.onclick = () => { document.getElementById("etapa" + etapa).style.display = "none"; etapa++; document.getElementById("etapa" + etapa).style.display = "block"; };
  document.getElementById("finalizar").onclick = () => { document.body.innerHTML = "<h1>Candidatura realizada!</h1><p>Agora realize os testes da próxima etapa.</p>"; };
</script>
</body></html>
